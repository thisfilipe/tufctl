name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: formatting
        run: cargo fmt --check

      - name: lints
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo test

      - name: release build
        run: cargo build --release
